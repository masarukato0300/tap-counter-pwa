<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f8fb">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="タップ集計">
    <title>タップ集計</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main id="app" class="app-shell">
      <section id="mainView" class="main-view" aria-labelledby="appTitle">
        <header class="topbar">
          <div>
            <h1 id="appTitle">タップ集計</h1>
            <p id="todayLabel" class="date-label"></p>
          </div>
          <button id="openCalendarButton" class="icon-text-button" type="button">集計</button>
        </header>

        <section class="total-panel" aria-live="polite">
          <span>今日の合計</span>
          <strong id="todayTotal">0</strong>
          <span>人</span>
        </section>

        <section class="tap-grid" aria-label="カウントボタン">
          <button class="tap-card male-business" type="button" data-action="increment" data-key="male_business">
            <span class="category">男性</span>
            <span class="purpose">ビジネス</span>
            <strong id="count-male_business">0</strong>
            <span class="minus-control" data-action="decrement" data-key="male_business">-1</span>
          </button>
          <button class="tap-card male-private" type="button" data-action="increment" data-key="male_private">
            <span class="category">男性</span>
            <span class="purpose">プライベート</span>
            <strong id="count-male_private">0</strong>
            <span class="minus-control" data-action="decrement" data-key="male_private">-1</span>
          </button>
          <button class="tap-card female-business" type="button" data-action="increment" data-key="female_business">
            <span class="category">女性</span>
            <span class="purpose">ビジネス</span>
            <strong id="count-female_business">0</strong>
            <span class="minus-control" data-action="decrement" data-key="female_business">-1</span>
          </button>
          <button class="tap-card female-private" type="button" data-action="increment" data-key="female_private">
            <span class="category">女性</span>
            <span class="purpose">プライベート</span>
            <strong id="count-female_private">0</strong>
            <span class="minus-control" data-action="decrement" data-key="female_private">-1</span>
          </button>
        </section>

        <footer class="main-actions">
          <button id="editModeButton" class="secondary-button" type="button" aria-pressed="false">修正モード</button>
          <button id="resetButton" class="danger-button" type="button">今日をリセット</button>
        </footer>
      </section>

      <section id="calendarView" class="calendar-view hidden" aria-labelledby="calendarTitle">
        <header class="calendar-header">
          <button id="backButton" class="secondary-button" type="button">戻る</button>
          <h2 id="calendarTitle">集計カレンダー</h2>
          <button id="csvButton" class="secondary-button" type="button">CSV</button>
        </header>

        <div class="month-switcher">
          <button id="prevMonthButton" type="button" aria-label="前月">‹</button>
          <strong id="monthLabel"></strong>
          <button id="nextMonthButton" type="button" aria-label="翌月">›</button>
        </div>
        <button id="currentMonthButton" class="today-button" type="button">今月に戻る</button>

        <section class="calendar-card">
          <div class="weekday-row" aria-hidden="true">
            <span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span><span>日</span>
          </div>
          <div id="calendarGrid" class="calendar-grid"></div>
        </section>

        <section class="summary-section">
          <h3>月間集計</h3>
          <div id="monthSummary" class="summary-grid"></div>
        </section>

        <section class="summary-section">
          <h3>週ごとの集計</h3>
          <div id="weekSummary" class="stack-list"></div>
        </section>

        <section class="summary-section">
          <h3>曜日ごとの集計</h3>
          <div id="weekdaySummary" class="stack-list"></div>
        </section>
      </section>
    </main>

    <dialog id="detailDialog" class="detail-dialog">
      <form method="dialog">
        <header>
          <h3 id="detailTitle"></h3>
          <button type="submit" aria-label="閉じる">×</button>
        </header>
        <div id="detailBody" class="summary-grid"></div>
      </form>
    </dialog>

    <script src="app.js" defer></script>
  </body>
</html>
